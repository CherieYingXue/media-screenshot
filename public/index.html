<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Screenshots — Desktop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 32px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #f8fafc;
    }
    header p {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 6px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .capture-all {
      flex: 1;
      padding: 14px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .capture-all:disabled { opacity: 0.6; cursor: wait; }
    .sites {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .site-card {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      gap: 10px;
      border-bottom: 1px solid #334155;
    }
    .site-name {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .site-url {
      font-size: 0.75rem;
      color: #64748b;
    }
    .btn-capture {
      padding: 8px 16px;
      background: #22c55e;
      color: #052e16;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-capture:disabled { opacity: 0.5; cursor: wait; }
    .site-preview {
      padding: 10px;
      background: #0f172a;
    }
    .img-wrap {
      overflow-x: auto;
      overflow-y: hidden;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #fff;
      -webkit-overflow-scrolling: touch;
    }
    .site-preview img {
      display: block;
      height: auto;
      min-width: 100%;
      width: 1920px;
      max-width: none;
    }
    .site-preview .meta {
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 8px;
      text-align: center;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 48px 24px;
      color: #94a3b8;
      font-size: 0.85rem;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      color: #f87171;
      font-size: 0.8rem;
      padding: 16px;
      text-align: center;
    }
    .hint {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 16px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #334155;
      color: #f1f5f9;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>News Screenshots</h1>
    <p>Desktop (PC) homepage views — 1920×1080</p>
  </header>

  <p class="hint">Swipe left/right on each image to see the full desktop layout</p>

  <div class="toolbar">
    <button class="capture-all" id="captureAll">Refresh All Screenshots</button>
  </div>

  <div class="sites" id="sites"></div>
  <div class="toast" id="toast"></div>

  <script>
    const sitesEl = document.getElementById('sites');
    const captureAllBtn = document.getElementById('captureAll');
    const toast = document.getElementById('toast');
    let sites = [];
    let busy = false;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function setBusy(state) {
      busy = state;
      captureAllBtn.disabled = state;
      document.querySelectorAll('.btn-capture').forEach((b) => (b.disabled = state));
    }

    function showLoading(preview) {
      preview.innerHTML = '<div class="loading"><div class="spinner"></div> Capturing desktop view…</div>';
    }

    function showImage(preview, data, name) {
      preview.innerHTML = `
        <div class="img-wrap">
          <img src="${data.url}?t=${Date.now()}" alt="${name} desktop screenshot">
        </div>
        <div class="meta">Desktop capture · ${new Date(data.capturedAt).toLocaleString()}</div>`;
    }

    function renderSites() {
      sitesEl.innerHTML = sites
        .map(
          (s) => `
        <div class="site-card" data-id="${s.id}">
          <div class="site-header">
            <div>
              <div class="site-name">${s.name}</div>
              <div class="site-url">${s.url.replace('https://', '')}</div>
            </div>
            <button class="btn-capture" data-id="${s.id}">Refresh</button>
          </div>
          <div class="site-preview" id="preview-${s.id}">
            <div class="loading"><div class="spinner"></div> Loading…</div>
          </div>
        </div>`
        )
        .join('');

      document.querySelectorAll('.btn-capture').forEach((btn) => {
        btn.addEventListener('click', () => captureOne(btn.dataset.id));
      });
    }

    async function captureOne(id) {
      if (busy) return;
      setBusy(true);
      const site = sites.find((s) => s.id === id);
      const preview = document.getElementById(`preview-${id}`);
      showLoading(preview);

      try {
        const res = await fetch(`/api/screenshot/${id}`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Capture failed');
        showImage(preview, data, site.name);
        showToast(`${site.name} updated`);
      } catch (err) {
        preview.innerHTML = `<div class="error-msg">${err.message}</div>`;
      } finally {
        setBusy(false);
      }
    }

    async function captureAll() {
      if (busy) return;
      setBusy(true);
      showToast('Capturing all desktop sites…');

      for (const site of sites) {
        showLoading(document.getElementById(`preview-${site.id}`));
      }

      try {
        const res = await fetch('/api/screenshot-all', { method: 'POST' });
        const data = await res.json();

        for (const r of data.results) {
          const preview = document.getElementById(`preview-${r.siteId}`);
          if (r.ok) {
            showImage(preview, r, r.site);
          } else {
            preview.innerHTML = `<div class="error-msg">${r.error}</div>`;
          }
        }
        showToast('All desktop screenshots ready');
      } catch (err) {
        showToast('Capture failed');
      } finally {
        setBusy(false);
      }
    }

    captureAllBtn.addEventListener('click', captureAll);

    fetch('/api/sites')
      .then((r) => r.json())
      .then((data) => {
        sites = data;
        renderSites();
        captureAll();
      });
  </script>
</body>
</html>
