<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Screenshots — Desktop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 32px;
    }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.35rem; font-weight: 700; color: #f8fafc; }
    header p { font-size: 0.8rem; color: #94a3b8; margin-top: 6px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; }
    .capture-all {
      flex: 1;
      padding: 14px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .capture-all:disabled { opacity: 0.6; cursor: wait; }
    .progress {
      text-align: center;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 16px;
      min-height: 1.2em;
    }
    .sites { display: flex; flex-direction: column; gap: 16px; }
    .site-card {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      gap: 10px;
      border-bottom: 1px solid #334155;
    }
    .site-name { font-weight: 600; font-size: 0.95rem; }
    .site-url { font-size: 0.75rem; color: #64748b; }
    .btn-capture {
      padding: 8px 16px;
      background: #22c55e;
      color: #052e16;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-capture:disabled { opacity: 0.5; cursor: wait; }
    .site-preview { padding: 10px; background: #0f172a; }
    .img-wrap {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #fff;
      -webkit-overflow-scrolling: touch;
    }
    .site-preview img {
      display: block;
      width: 100%;
      height: auto;
    }
    .site-preview .meta {
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 8px;
      text-align: center;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 48px 24px;
      color: #94a3b8;
      font-size: 0.85rem;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      color: #f87171;
      font-size: 0.8rem;
      padding: 16px;
      text-align: center;
    }
    .hint {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 16px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #334155;
      color: #f1f5f9;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>News Screenshots</h1>
    <p id="viewportLabel">Desktop homepage — 960×540</p>
  </header>

  <p class="hint">Sites load one at a time for faster, more reliable captures</p>
  <p class="progress" id="progress"></p>

  <div class="toolbar">
    <button class="capture-all" id="captureAll">Refresh All Screenshots</button>
  </div>

  <div class="sites" id="sites"></div>
  <div class="toast" id="toast"></div>

  <script>
    const sitesEl = document.getElementById('sites');
    const captureAllBtn = document.getElementById('captureAll');
    const progressEl = document.getElementById('progress');
    const toast = document.getElementById('toast');
    const CAPTURE_TIMEOUT_MS = 130000;
    let sites = [];
    let busy = false;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function setBusy(state) {
      busy = state;
      captureAllBtn.disabled = state;
      document.querySelectorAll('.btn-capture').forEach((b) => (b.disabled = state));
    }

    function showLoading(preview, msg) {
      preview.innerHTML = `<div class="loading"><div class="spinner"></div> ${msg || 'Capturing…'}</div>`;
    }

    function showImage(preview, data, name) {
      preview.innerHTML = `
        <div class="img-wrap">
          <img src="${data.url}?t=${Date.now()}" alt="${name} screenshot">
        </div>
        <div class="meta">960×540 desktop · ${new Date(data.capturedAt).toLocaleString()}</div>`;
    }

    async function fetchWithTimeout(url, options = {}) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), CAPTURE_TIMEOUT_MS);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    function renderSites() {
      sitesEl.innerHTML = sites
        .map(
          (s) => `
        <div class="site-card" data-id="${s.id}">
          <div class="site-header">
            <div>
              <div class="site-name">${s.name}</div>
              <div class="site-url">${s.url.replace('https://', '')}</div>
            </div>
            <button class="btn-capture" data-id="${s.id}">Refresh</button>
          </div>
          <div class="site-preview" id="preview-${s.id}">
            <div class="loading"><div class="spinner"></div> Waiting…</div>
          </div>
        </div>`
        )
        .join('');

      document.querySelectorAll('.btn-capture').forEach((btn) => {
        btn.addEventListener('click', () => captureOne(btn.dataset.id));
      });
    }

    async function captureOne(id, showProgress) {
      const site = sites.find((s) => s.id === id);
      const preview = document.getElementById(`preview-${id}`);
      showLoading(preview, `Capturing ${site.name}…`);
      if (showProgress) progressEl.textContent = `Capturing ${site.name}…`;

      const res = await fetchWithTimeout(`/api/screenshot/${id}`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Capture failed');
      showImage(preview, data, site.name);
      return data;
    }

    async function captureAllSequential() {
      if (busy) return;
      setBusy(true);
      showToast('Capturing sites one by one…');

      let done = 0;
      for (const site of sites) {
        progressEl.textContent = `Capturing ${done + 1}/${sites.length}: ${site.name}…`;
        const preview = document.getElementById(`preview-${site.id}`);
        try {
          await captureOne(site.id, false);
          done += 1;
        } catch (err) {
          preview.innerHTML = `<div class="error-msg">${err.message}</div>`;
        }
      }

      progressEl.textContent = `Done — ${done}/${sites.length} captured`;
      showToast(`Finished (${done}/${sites.length})`);
      setBusy(false);
    }

    captureAllBtn.addEventListener('click', captureAllSequential);

    Promise.all([
      fetch('/api/sites').then((r) => r.json()),
      fetch('/api/config').then((r) => r.json()).catch(() => null),
    ]).then(([siteList, config]) => {
      sites = siteList;
      if (config?.viewport) {
        document.getElementById('viewportLabel').textContent =
          `Desktop homepage — ${config.viewport.width}×${config.viewport.height}`;
      }
      renderSites();
      captureAllSequential();
    });
  </script>
</body>
</html>
